name: Build 不许涩涩的异世界

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build
        run: gradle clean build --no-daemon

      - name: Verify required mod resources
        run: |
          jar_file=$(find build/libs -maxdepth 1 -name 'no-lewd-otherworld-*.jar' ! -name '*sources.jar' | head -n 1)
          test -n "$jar_file"
          jar tf "$jar_file" | grep -Fx 'assets/no_lewd_otherworld/textures/item/muzzle_face.png'
          jar tf "$jar_file" | grep -Fx 'data/no_lewd_otherworld/recipe/lockbox_photo.json'
          jar tf "$jar_file" | grep -Fx 'pack.mcmeta'

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: no-lewd-otherworld-1.0.16
          path: build/libs/no-lewd-otherworld-1.0.16.jar
