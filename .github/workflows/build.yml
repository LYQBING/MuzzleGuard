name: Build Muzzle Guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build
        run: gradle clean build --no-daemon

      - name: Verify required mod resources
        run: |
          jar tf build/libs/muzzle-guard-1.0.14.jar | grep -Fx 'assets/muzzle_guard/textures/item/muzzle_face.png'
          jar tf build/libs/muzzle-guard-1.0.14.jar | grep -Fx 'data/muzzle_guard/recipe/lockbox_photo.json'

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: muzzle-guard-1.0.14
          path: build/libs/muzzle-guard-1.0.14.jar
