name: Build 不许涩涩的异世界

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mod_version:
        description: "Optional version override (blank uses gradle.properties)"
        required: false
        type: string
      mod_description:
        description: "Optional mod description override (blank uses gradle.properties)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build
        env:
          MOD_VERSION: ${{ inputs.mod_version }}
          MOD_DESCRIPTION: ${{ inputs.mod_description }}
        run: |
          gradle_args=(clean build --no-daemon)
          if [[ -n "$MOD_VERSION" ]]; then
            gradle_args+=("-Pmod_version=$MOD_VERSION")
          fi
          if [[ -n "$MOD_DESCRIPTION" ]]; then
            gradle_args+=("-Pmod_description=$MOD_DESCRIPTION")
          fi
          gradle "${gradle_args[@]}"

      - name: Locate mod JAR
        id: mod_jar
        run: |
          jar_file=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit)
          if [[ -z "$jar_file" ]]; then
            echo "No remapped mod JAR was produced." >&2
            exit 1
          fi
          echo "path=$jar_file" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$jar_file" .jar)" >> "$GITHUB_OUTPUT"

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mod_jar.outputs.name }}
          path: ${{ steps.mod_jar.outputs.path }}
